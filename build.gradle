plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Submersibles, and what it nests (Vanilla Wheels and its own), come from
// Maven Local until a real repository exists (`./gradlew publishToMavenLocal`
// in each repo, Vanilla Wheels first).
repositories {
    mavenCentral()
    mavenLocal()
}

// The submarine is data and assets: `main` has no Java at all and loads as
// a lowcodefml mod. `gametest` is a mod of its own, with the tests and the
// photo booth, and is never shipped.
sourceSets {
    gametest
}

var copyGameTestStructures = tasks.register("copyGameTestStructures", Copy) {
    from "devtools/gameteststructures"
    into "run/gameteststructures"
}

var prepareBooth = tasks.register("prepareBooth") {
    def booth = layout.projectDirectory.dir('run/booth').asFile
    outputs.upToDateWhen { false }
    doLast {
        new File(booth, 'screenshots').deleteDir()
        new File(booth, 'saves').deleteDir()
        // A fresh game directory opens on the accessibility onboarding screen,
        // which the booth would wait behind forever; a seeded options file
        // takes the client straight to the title screen, muted.
        def options = new File(booth, 'options.txt')
        if (!options.exists()) {
            booth.mkdirs()
            options.text = "onboardAccessibility:false\nnarrator:0\nsoundCategory_master:0.0\n"
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            taskBefore copyGameTestStructures
        }
        photoBooth {
            client()
            programArguments.addAll('--width', '1280', '--height', '720')
            sourceSet = sourceSets.gametest
            gameDirectory = file('run/booth')
            systemProperty "${mod_id}.photobooth", 'true'
            taskBefore prepareBooth
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_gametest" {
            sourceSet(sourceSets.gametest)
        }
    }

    addModdingDependenciesTo(sourceSets.gametest)
}

neoForge.runs.matching { it.name != 'gameTestServer' && it.name != 'photoBooth' }.configureEach {
    loadedMods = neoForge.mods.matching { it.name != "${mod_id}_gametest" }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    // The protocol: everything this submarine does. Nested Jar-in-Jar, with
    // what it nests: Vanilla Wheels (and its Luminance and Carried). Metals
    // and Materials is required separately through Vanilla Wheels.
    jarJar(implementation("com.chunkworks.submersibles:submersibles")) {
        version {
            strictly "[1.0,2.0)"
            prefer "1.0.0"
        }
    }

    gametestImplementation sourceSets.main.output
    // The tests reach into Vanilla Wheels' API, which Submersibles keeps to itself at compile time.
    gametestImplementation("com.chunkworks.vanillawheels:vanillawheels:1.13.0")
}

tasks.named('runGameTestServer') { task ->
    def logFile = layout.projectDirectory.file('run/logs/latest.log').asFile
    task.doLast {
        def text = logFile.exists() ? logFile.text : ''
        if (text =~ /Missing or unsupported mandatory|Mod loading has failed/) {
            throw new GradleException("gametest: the loader refused a mod; see ${logFile}")
        }
        def passed = (text =~ /All (\d+) required tests passed/)
        if (!passed.find()) {
            throw new GradleException("gametest: no 'required tests passed' line in ${logFile}")
        }
        task.logger.lifecycle("gametest: all ${passed.group(1)} required tests passed")
    }
}
if (!project.hasProperty('skipGameTests')) {
    tasks.named('check') {
        dependsOn 'runGameTestServer'
    }
}

tasks.named('runPhotoBooth') { task ->
    def logFile = layout.projectDirectory.file('run/booth/logs/latest.log').asFile
    task.doLast {
        def text = logFile.exists() ? logFile.text : ''
        if (text =~ /Missing or unsupported mandatory|Mod loading has failed/) {
            throw new GradleException("booth: the loader refused a mod; see ${logFile}")
        }
        def failures = text.readLines().findAll { it.contains('booth: FAIL') }
        if (!failures.isEmpty()) {
            throw new GradleException("booth: ${failures.size()} failed check(s):\n" + failures.join('\n'))
        }
        if (!text.contains('booth: PASS all checks ran')) {
            throw new GradleException("booth: missing completion marker in ${logFile} -- the booth never finished")
        }
        task.logger.lifecycle("booth: " + text.readLines().count { it.contains('booth: PASS') } + " checks passed")
    }
}
if (!project.hasProperty('skipBooth') && !project.hasProperty('skipGameTests')) {
    tasks.named('runPhotoBooth') { mustRunAfter 'runGameTestServer' }
    tasks.named('check') { dependsOn 'runPhotoBooth' }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
